name: Uppdatera europeiska elpriser (lokal valuta)

on:
  schedule:
    # Körs kl. 12:40 UTC varje dag (= 13:40 vintertid / 14:40 sommartid)
    - cron: '30 * * * *'
    # Reservkörning 1 timme senare ifall någon börs är försenad
    - cron: '40 13 * * *'
    - cron: '16 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden från repositoryt
        uses: actions/checkout@v5

      - name: Sätt upp Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hämta elpriser för samtliga länder och bygg JSON-filer
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_all_prices.py

      - name: Spara uppdaterade JSON-filer till GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Uppdatera elpriser $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
