name: Uppdatera tyska elpriser

on:
  schedule:
    # Körs kl. 12:30 UTC varje dag (= 13:30 vintertid / 14:30 sommartid i Sverige & Tyskland)
    - cron: '30 12 * * *'
    # Extra reservkörning 1 timme senare ifall ENTSO-E skulle vara försenat någon dag
    - cron: '30 13 * * *'
  workflow_dispatch: # Gör att du kan klicka "Run workflow" manuellt för att testa direkt

permissions:
  contents: write # Krävs för att GitHub Actions ska få spara prices.json i repot

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden från repositoryt
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta elpriser och bygg JSON
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_prices.py

      - name: Spara uppdaterad prices.json till GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Uppdatera elpriser $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
